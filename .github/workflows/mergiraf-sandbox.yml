name: AEGIS Mergiraf sandbox

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-mergiraf-sandbox-${{ github.event.pull_request.number || github.ref }}
  # Let the pinned Rust install/sandbox finish; superseding commits should queue
  # rather than cancel the only independent merge-conflict verification.
  cancel-in-progress: false

jobs:
  isolated-merge:
    name: Pinned Mergiraf conflict-resolution smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify runner Rust toolchain
        run: |
          rustc --version
          cargo --version
      - name: Install pinned Mergiraf release
        run: cargo install --locked --version 0.20.0 mergiraf
      - name: Verify isolated conflict resolution
        run: bash scripts/mergiraf-sandbox.sh
