name: Validate D1 Migrations

on:
  push:
    branches: [ "feature/production-migrations" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install wrangler --save-dev

      - name: Create Local-Only Wrangler Configuration
        run: |
          cat > wrangler.jsonc <<'EOF'
          {
            "name": "aegis-migration-validation",
            "compatibility_date": "2026-11-25",
            "d1_databases": [
              {
                "binding": "AEGIS_DB",
                "database_name": "aegis-production-local-test",
                "database_id": "00000000-0000-0000-0000-000000000000",
                "migrations_dir": "migrations/production"
              }
            ]
          }
          EOF

      - name: Run Local D1 Migrations
        run: npx wrangler d1 migrations apply aegis-production-local-test --local
