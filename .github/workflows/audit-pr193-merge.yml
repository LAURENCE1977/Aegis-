name: AEGIS PR 193 merge-base audit

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  merge-tree-audit:
    name: Reproduce PR 193 against current integration base
    runs-on: ubuntu-latest
    steps:
      - name: Check out merge-intelligence branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reproduce merge without changing either branch
        env:
          BASE_SHA: 3db32598e05c8efde94411242343915a3a000b5a
          PR193_SHA: 9843ea1c0b920fc517346383a192999b8d15dbdb
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA"
          BASE="$BASE_SHA"
          git fetch --no-tags origin "$PR193_SHA"
          HEAD_SHA="$PR193_SHA"
          MERGE_BASE="$(git merge-base "$BASE" "$HEAD_SHA")"
          echo "Merge base: $MERGE_BASE"
          echo "Integration base: $BASE"
          echo "PR #193 head: $HEAD_SHA"
          set +e
          git merge-tree --write-tree "$BASE" "$HEAD_SHA" > /tmp/merge-tree.txt 2>&1
          MERGE_STATUS=$?
          set -e
          cat /tmp/merge-tree.txt
          {
            echo "## PR #193 isolated merge-tree reproduction"
            echo
            echo "- Common ancestor: $MERGE_BASE"
            echo "- Current integration base: $BASE"
            echo "- PR #193 head: $HEAD_SHA"
            echo "- git merge-tree exit code: $MERGE_STATUS"
            echo
            echo '```text'
            cat /tmp/merge-tree.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$MERGE_STATUS" -gt 1 ]; then
            echo "git merge-tree failed unexpectedly."
            exit "$MERGE_STATUS"
          fi
