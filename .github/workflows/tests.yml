name: AEGIS tests

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'repair/**'
      - 'stack/**'
      - 'docs/**'
      - 'test/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aegis-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js tests and local D1 migration verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Node.js test suite
        run: node --test tests/*.test.mjs
      - name: Install Wrangler for local D1 verification
        run: npm install --global wrangler@4
      - name: Apply capability migrations to isolated local D1
        run: wrangler d1 migrations apply aegis-capabilities-test --local --config wrangler.d1-test.toml --persist-to .wrangler/test-capability-d1
      - name: Smoke-test all capability tables and constraints
        run: wrangler d1 execute aegis-capabilities-test --local --config wrangler.d1-test.toml --persist-to .wrangler/test-capability-d1 --file scripts/capability-d1-smoke.sql
      - name: Verify integration inventory constraints
        run: bash scripts/capability-d1-integration-inventory-checks.sh
      - name: Verify append-only integration connection audit
        run: bash scripts/capability-d1-integration-audit-checks.sh

      - name: Verify atomic per-action rate-limit reservation
        run: wrangler d1 execute aegis-capabilities-test --local --config wrangler.d1-test.toml --persist-to .wrangler/test-capability-d1 --file scripts/capability-d1-rate-limit.sql
      - name: Verify active-grant uniqueness and append-only audit triggers
        shell: bash
        run: |
          if wrangler d1 execute aegis-capabilities-test --local --config wrangler.d1-test.toml --persist-to .wrangler/test-capability-d1 --command "INSERT INTO capability_grants (id, principal_id, capability_id, capability_version, resource_id, scopes_json, status, created_by, created_at, expires_at, revoked_at) VALUES ('grant-duplicate', 'owner', 'aegis-module-catalogue', '0.1.0', 'aegis:modules', '[\"aegis:module-catalogue:read\"]', 'active', 'owner', '2026-11-16T00:00:00.000Z', '2026-11-17T00:00:00.000Z', NULL)"; then
            echo "Expected the active-grant uniqueness index to reject a duplicate."
            exit 1
          fi
          if wrangler d1 execute aegis-capabilities-test --local --config wrangler.d1-test.toml --persist-to .wrangler/test-capability-d1 --command "UPDATE capability_invocation_audit SET reason_code = 'TAMPERED' WHERE id = 'audit-smoke'"; then
            echo "Expected the append-only audit update trigger to reject mutation."
            exit 1
          fi
          if wrangler d1 execute aegis-capabilities-test --local --config wrangler.d1-test.toml --persist-to .wrangler/test-capability-d1 --command "DELETE FROM capability_invocation_audit WHERE id = 'audit-smoke'"; then
            echo "Expected the append-only audit delete trigger to reject mutation."
            exit 1
          fi

      - name: Apply runtime migrations to isolated local D1
        run: wrangler d1 migrations apply aegis-runtime-test --local --config wrangler.runtime-d1-test.toml --persist-to .wrangler/test-runtime-d1
      - name: Verify runtime experiment record isolation and immutable audit constraints
        shell: bash
        run: |
          set -euo pipefail
          wrangler d1 execute aegis-runtime-test --local --config wrangler.runtime-d1-test.toml --persist-to .wrangler/test-runtime-d1 --file scripts/runtime-d1-smoke.sql
          if wrangler d1 execute aegis-runtime-test --local --config wrangler.runtime-d1-test.toml --persist-to .wrangler/test-runtime-d1 --command "UPDATE experiment_records SET record_json = '{}' WHERE principal_id = 'principal-a' AND record_id = 'record-smoke'"; then
            echo "Expected experiment record immutability trigger to reject updates."
            exit 1
          fi
          if wrangler d1 execute aegis-runtime-test --local --config wrangler.runtime-d1-test.toml --persist-to .wrangler/test-runtime-d1 --command "DELETE FROM experiment_records WHERE principal_id = 'principal-a' AND record_id = 'record-smoke'"; then
            echo "Expected experiment record immutability trigger to reject deletion."
            exit 1
          fi
          if wrangler d1 execute aegis-runtime-test --local --config wrangler.runtime-d1-test.toml --persist-to .wrangler/test-runtime-d1 --command "UPDATE experiment_record_events SET event_type = 'created' WHERE event_id = 'tombstoned:principal-a:record-smoke'"; then
            echo "Expected experiment event append-only trigger to reject updates."
            exit 1
          fi
          if wrangler d1 execute aegis-runtime-test --local --config wrangler.runtime-d1-test.toml --persist-to .wrangler/test-runtime-d1 --command "DELETE FROM experiment_record_events WHERE event_id = 'tombstoned:principal-a:record-smoke'"; then
            echo "Expected experiment event append-only trigger to reject deletion."
            exit 1
          fi
          if wrangler d1 execute aegis-runtime-test --local --config wrangler.runtime-d1-test.toml --persist-to .wrangler/test-runtime-d1 --command "INSERT INTO experiment_record_events (event_id, principal_id, record_id, actor_principal_id, event_type, record_digest, created_at) VALUES ('duplicate-tombstone', 'principal-a', 'record-smoke', 'principal-a', 'tombstoned', 'sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa', '2026-11-20T23:02:00.000Z')"; then
            echo "Expected the unique tombstone index to reject a second deletion event."
            exit 1
          fi
          if wrangler d1 execute aegis-runtime-test --local --config wrangler.runtime-d1-test.toml --persist-to .wrangler/test-runtime-d1 --command "INSERT INTO experiment_records (principal_id, record_id, schema_version, record_digest, record_json, created_at) VALUES ('principal-c', 'bad-digest', 'aegis.experiment-record.v1', 'not-a-digest', '{}', '2026-11-20T23:00:00.000Z')"; then
            echo "Expected the record digest constraint to reject malformed digests."
            exit 1
          fi
          if wrangler d1 execute aegis-runtime-test --local --config wrangler.runtime-d1-test.toml --persist-to .wrangler/test-runtime-d1 --command "INSERT INTO experiment_record_events (event_id, principal_id, record_id, actor_principal_id, event_type, record_digest, created_at) VALUES ('orphan-event', 'principal-missing', 'missing-record', 'principal-missing', 'created', 'sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa', '2026-11-20T23:02:00.000Z')"; then
            echo "Expected the experiment event foreign key to reject orphan events."
            exit 1
          fi

      - name: Build runtime Worker without deploying
        run: wrangler deploy --dry-run --outdir .wrangler/runtime-dry-run --config wrangler.runtime-dry-run.toml
      - name: Apply Forge migrations to isolated local D1
        run: wrangler d1 migrations apply aegis-forge-test --local --config wrangler.forge-d1-test.toml --persist-to .wrangler/test-forge-d1
      - name: Verify Forge licence gates, immutable source identity and append-only review events
        shell: bash
        run: |
          wrangler d1 execute aegis-forge-test --local --config wrangler.forge-d1-test.toml --persist-to .wrangler/test-forge-d1 --file scripts/forge-d1-seed.sql
          if wrangler d1 execute aegis-forge-test --local --config wrangler.forge-d1-test.toml --persist-to .wrangler/test-forge-d1 --command "UPDATE forge_candidates SET decision = 'adapt' WHERE id = 'forge-smoke'"; then
            echo "Expected licence gate to reject reuse before owner verification."
            exit 1
          fi
          wrangler d1 execute aegis-forge-test --local --config wrangler.forge-d1-test.toml --persist-to .wrangler/test-forge-d1 --file scripts/forge-d1-review.sql
          if wrangler d1 execute aegis-forge-test --local --config wrangler.forge-d1-test.toml --persist-to .wrangler/test-forge-d1 --command "UPDATE forge_candidates SET metadata_json = json_set(metadata_json, '$.description', 'tampered') WHERE id = 'forge-smoke'"; then
            echo "Expected source metadata immutability trigger to reject tampering."
            exit 1
          fi
          if wrangler d1 execute aegis-forge-test --local --config wrangler.forge-d1-test.toml --persist-to .wrangler/test-forge-d1 --command "UPDATE forge_candidate_events SET to_status = 'rejected' WHERE candidate_id = 'forge-smoke'"; then
            echo "Expected append-only candidate event trigger to reject mutation."
            exit 1
          fi
          if wrangler d1 execute aegis-forge-test --local --config wrangler.forge-d1-test.toml --persist-to .wrangler/test-forge-d1 --command "DELETE FROM forge_candidate_events WHERE candidate_id = 'forge-smoke'"; then
            echo "Expected append-only candidate event trigger to reject deletion."
            exit 1
          fi
          wrangler d1 execute aegis-forge-test --local --config wrangler.forge-d1-test.toml --persist-to .wrangler/test-forge-d1 --file scripts/forge-d1-assert.sql

      - name: Apply read-only financial ledger migrations to isolated local D1
        run: wrangler d1 migrations apply aegis-finance-test --local --config wrangler.finance-d1-test.toml --persist-to .wrangler/test-finance-d1
      - name: Verify owner-scoped financial ledger, exact amounts and append-only observations
        shell: bash
        run: |
          wrangler d1 execute aegis-finance-test --local --config wrangler.finance-d1-test.toml --persist-to .wrangler/test-finance-d1 --file scripts/finance-d1-seed.sql
          bash scripts/finance-d1-checks.sh
