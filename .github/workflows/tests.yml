name: AEGIS tests

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'repair/**'
      - 'stack/**'
      - 'docs/**'
      - 'test/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: aegis-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js tests and local D1 migration verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Node.js test suite
        run: node --test tests/*.test.mjs
      - name: Install Wrangler for local D1 verification
        run: npm install --global wrangler@4
      - name: Apply capability migrations to isolated local D1
        run: wrangler d1 migrations apply aegis-capabilities-test --local --config wrangler.d1-test.toml --persist-to .wrangler/test-capability-d1
      - name: Smoke-test all capability tables and constraints
        run: wrangler d1 execute aegis-capabilities-test --local --config wrangler.d1-test.toml --persist-to .wrangler/test-capability-d1 --file scripts/capability-d1-smoke.sql
      - name: Verify atomic per-action rate-limit reservation
        run: wrangler d1 execute aegis-capabilities-test --local --config wrangler.d1-test.toml --persist-to .wrangler/test-capability-d1 --file scripts/capability-d1-rate-limit.sql
      - name: Verify active-grant uniqueness and append-only audit triggers
        shell: bash
        run: |
          if wrangler d1 execute aegis-capabilities-test --local --config wrangler.d1-test.toml --persist-to .wrangler/test-capability-d1 --command "INSERT INTO capability_grants (id, principal_id, capability_id, capability_version, resource_id, scopes_json, status, created_by, created_at, expires_at, revoked_at) VALUES ('grant-duplicate', 'owner', 'aegis-module-catalogue', '0.1.0', 'aegis:modules', '[\"aegis:module-catalogue:read\"]', 'active', 'owner', '2026-11-16T00:00:00.000Z', '2026-11-17T00:00:00.000Z', NULL)"; then
            echo "Expected the active-grant uniqueness index to reject a duplicate."
            exit 1
          fi
          if wrangler d1 execute aegis-capabilities-test --local --config wrangler.d1-test.toml --persist-to .wrangler/test-capability-d1 --command "UPDATE capability_invocation_audit SET reason_code = 'TAMPERED' WHERE id = 'audit-smoke'"; then
            echo "Expected the append-only audit update trigger to reject mutation."
            exit 1
          fi
          if wrangler d1 execute aegis-capabilities-test --local --config wrangler.d1-test.toml --persist-to .wrangler/test-capability-d1 --command "DELETE FROM capability_invocation_audit WHERE id = 'audit-smoke'"; then
            echo "Expected the append-only audit delete trigger to reject mutation."
            exit 1
          fi

      - name: Apply Forge migrations to isolated local D1
        run: wrangler d1 migrations apply aegis-forge-test --local --config wrangler.forge-d1-test.toml --persist-to .wrangler/test-forge-d1
      - name: Verify Forge licence gates, immutable source identity and append-only review events
        shell: bash
        run: |
          wrangler d1 execute aegis-forge-test --local --config wrangler.forge-d1-test.toml --persist-to .wrangler/test-forge-d1 --file scripts/forge-d1-seed.sql
          if wrangler d1 execute aegis-forge-test --local --config wrangler.forge-d1-test.toml --persist-to .wrangler/test-forge-d1 --command "UPDATE forge_candidates SET decision = 'adapt' WHERE id = 'forge-smoke'"; then
            echo "Expected licence gate to reject reuse before owner verification."
            exit 1
          fi
          wrangler d1 execute aegis-forge-test --local --config wrangler.forge-d1-test.toml --persist-to .wrangler/test-forge-d1 --file scripts/forge-d1-review.sql
          if wrangler d1 execute aegis-forge-test --local --config wrangler.forge-d1-test.toml --persist-to .wrangler/test-forge-d1 --command "UPDATE forge_candidates SET metadata_json = json_set(metadata_json, '$.description', 'tampered') WHERE id = 'forge-smoke'"; then
            echo "Expected source metadata immutability trigger to reject tampering."
            exit 1
          fi
          if wrangler d1 execute aegis-forge-test --local --config wrangler.forge-d1-test.toml --persist-to .wrangler/test-forge-d1 --command "UPDATE forge_candidate_events SET to_status = 'rejected' WHERE candidate_id = 'forge-smoke'"; then
            echo "Expected append-only candidate event trigger to reject mutation."
            exit 1
          fi
          if wrangler d1 execute aegis-forge-test --local --config wrangler.forge-d1-test.toml --persist-to .wrangler/test-forge-d1 --command "DELETE FROM forge_candidate_events WHERE candidate_id = 'forge-smoke'"; then
            echo "Expected append-only candidate event trigger to reject deletion."
            exit 1
          fi
          wrangler d1 execute aegis-forge-test --local --config wrangler.forge-d1-test.toml --persist-to .wrangler/test-forge-d1 --file scripts/forge-d1-assert.sql
      - name: Build Pages Functions bundle
        run: wrangler pages functions build
      - name: Prepare isolated Pages runtime credentials
        shell: bash
        run: |
          printf 'AEGIS_PASSWORD=%s\n' 'aegis-pages-runtime-test-password' > .dev.vars
          printf 'AEGIS_SESSION_SECRET=%s\n' 'aegis-pages-runtime-test-session-secret-32chars' >> .dev.vars
      - name: Apply production Pages schema to isolated local D1
        run: wrangler d1 migrations apply aegis-production --local --config wrangler.toml --persist-to .wrangler/test-pages
      - name: Start local Cloudflare Pages runtime
        shell: bash
        run: |
          nohup wrangler pages dev public --d1 AEGIS_DB=44e524ef-c248-4232-93df-05220040f4bb --ip 127.0.0.1 --port 8788 --persist-to .wrangler/test-pages --log-level warn > /tmp/aegis-pages-dev.log 2>&1 &
          echo $! > /tmp/aegis-pages-dev.pid
          for attempt in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:8788/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aegis-pages-dev.log
          exit 1
      - name: Verify Pages middleware, request reconstruction and static assets
        env:
          AEGIS_PAGES_RUNTIME_URL: http://127.0.0.1:8788
          AEGIS_RUNTIME_TEST_PASSWORD: aegis-pages-runtime-test-password
        run: node --test tests/pages-runtime.test.mjs
      - name: Stop local Pages runtime and remove test credentials
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/aegis-pages-dev.pid ]; then kill "$(cat /tmp/aegis-pages-dev.pid)" || true; fi
          rm -f .dev.vars
