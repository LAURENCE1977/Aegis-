name: AEGIS tests

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'repair/**'
      - 'stack/**'
      - 'docs/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: aegis-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run test suite
        run: node --test tests/*.test.mjs
