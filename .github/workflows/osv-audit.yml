name: OSV dependency and source audit

on:
  push:
    branches:
      - main
      - feature/production-migrations
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      scan-args: "-r ."
      fail-on-vuln: true
      upload-sarif: false
