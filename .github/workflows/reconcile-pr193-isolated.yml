name: AEGIS PR 193 isolated reconciliation

on:
  push:
    branches:
      - feature/aegis-merge-intelligence-2026-11-23

permissions:
  contents: write

concurrency:
  group: aegis-pr193-reconciliation
  cancel-in-progress: true

jobs:
  reconcile:
    name: Resolve the single test-file conflict in a disposable branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out merge-intelligence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge PR 193 into a disposable review branch
        env:
          BASE_SHA: 3db32598e05c8efde94411242343915a3a000b5a
          PR193_SHA: 9843ea1c0b920fc517346383a192999b8d15dbdb
          TARGET_BRANCH: audit/pr193-reconciled-2026-11-23
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_SHA" "$PR193_SHA"
          git checkout --detach "$BASE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          git merge --no-commit --no-ff "$PR193_SHA"
          MERGE_STATUS=$?
          set -e
          UNMERGED="$(git diff --name-only --diff-filter=U)"
          if [ "$UNMERGED" != "tests/frontend-smoke.test.mjs" ]; then
            echo "Unexpected conflict set; refusing to create a reconciliation branch."
            printf '%s\n' "$UNMERGED"
            exit 1
          fi
          if [ "$MERGE_STATUS" -eq 0 ]; then
            echo "Expected the known frontend test append conflict but Git reported a clean merge."
            exit 1
          fi
          # Keep the integration branch's Composio smoke test and append the two
          # independent Health Vision tests from PR 193. No application code is
          # resolved by choosing one side: index.html auto-merges cleanly.
          git checkout --ours -- tests/frontend-smoke.test.mjs
          cat >> tests/frontend-smoke.test.mjs <<'HEALTH_TESTS'

test('Health Vision is a private, session-only observation workspace with camera support', () => {
  for (const id of [
    'healthVisionTab','healthVisionSection','healthObservationForm','healthKind',
    'healthBodyArea','healthObservedOn','healthDescription','healthSymptoms',
    'healthChanges','healthPhotoInput','healthStartCameraBtn','healthCameraVideo',
    'healthCaptureFrameBtn','healthStopCameraBtn','healthPhotoPreview',
    'healthObservationList','healthExportBtn','healthClearAllBtn',
  ]) {
    assert.match(html, new RegExp('id="' + id + '"'), 'missing Health Vision UI element: ' + id);
  }
  assert.match(html, /nothing is uploaded, sent to an AI model/i);
  assert.match(html, /This is not encrypted storage/);
  assert.match(html, /Health Vision roadmap/);
  assert.match(html, /Stage 5 · Clinician collaboration/);
  assert.match(html, /does not analyse the image, diagnose, assess cancer risk/i);
  assert.match(html, /healthVisionSection\.hidden = panel !== 'health'/);
  assert.match(html, /healthVisionTab\.addEventListener\('click',\s*\(\) => showPanel\('health'\)\)/);
  assert.match(html, /<script type="module" src="\/health-vision\.js"><\/script>/);
});

test('Health Vision does not add a server API route or persistent health-data browser store', async () => {
  const script = readFileSync(new URL('../health-vision.js', import.meta.url), 'utf8');
  assert.doesNotThrow(() => new vm.Script(script.replace(/^import[^\n]*\n/, '')));
  assert.doesNotMatch(script, /localStorage|sessionStorage|indexedDB|fetch\s*\(/);
  assert.match(script, /getUserMedia/);
  assert.match(script, /section\.hidden \|\| appPanel\.hidden \|\| document\.hidden/);
  assert.match(script, /visibilitychange/);
  assert.match(script, /URL\.createObjectURL/);
  assert.match(script, /pagehide/);
  assert.match(script, /appPanel\.hidden/);
  assert.match(script, /formatHealthVisionReport/);
  assert.doesNotMatch(script, /diagnos|risk score|treatment recommendation/i);
});
HEALTH_TESTS
          git add -A
          git -c core.hooksPath=/dev/null commit -m "merge: reconcile Health Vision with current integration base"
          node --test tests/*.test.mjs
          git push --force-with-lease=refs/heads/$TARGET_BRANCH: origin "HEAD:refs/heads/$TARGET_BRANCH" || git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          {
            echo "## Isolated PR 193 reconciliation"
            echo
            echo "- Result: merge commit created on disposable branch `$TARGET_BRANCH`."
            echo "- Conflict: only `tests/frontend-smoke.test.mjs`; both Composio and Health Vision tests retained."
            echo "- Application changes: `index.html` auto-merged; all Health Vision source/docs/tests included."
            echo "- Verification: `node --test tests/*.test.mjs` passed before the branch was pushed."
            echo "- No live PR branch, integration branch or production deployment was modified."
          } >> "$GITHUB_STEP_SUMMARY"
