name: AEGIS PR 193 isolated reconciliation

on:
  push:
    branches:
      - feature/aegis-merge-intelligence-2026-11-23

permissions:
  contents: write

concurrency:
  group: aegis-pr193-reconciliation
  cancel-in-progress: true

jobs:
  reconcile:
    name: Resolve the single test-file conflict in a disposable branch
    runs-on: ubuntu-latest
    steps:
      - name: Check out merge-intelligence branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge, resolve, test and publish the disposable review branch
        env:
          BASE_SHA: 3db32598e05c8efde94411242343915a3a000b5a
          PR193_SHA: 9843ea1c0b920fc517346383a192999b8d15dbdb
          TARGET_BRANCH: audit/pr193-reconciled-2026-11-23
        run: bash scripts/reconcile-pr193-isolated.sh
